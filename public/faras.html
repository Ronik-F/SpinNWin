<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashain × Tihar Fāras - Bumper Offers</title>
<style>
  :root{
    --gold:#e7b84b;
    --gold2:#ffd978;
    --ink:#25120d;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:system-ui, -apple-system, sans-serif;
    background: linear-gradient(to bottom, #7dd3fc, #e0f2fe, #fffbeb);
    overflow-x:hidden;
  }
  body:before{
    content:"";
    position:fixed; inset:0; pointer-events:none; opacity:.16;
    background-image:
      radial-gradient(circle, #fff 1px, transparent 1px),
      linear-gradient(45deg, transparent 48%, #e7b84b 49%, transparent 51%);
    background-size:24px 24px, 90px 90px;
  }
  
  .app{max-width:1400px;margin:auto;padding:10px 15px 40px; position:relative; z-index:10; display:flex; flex-direction:column; min-height:100vh;}
  header{text-align:center; margin-bottom: 10px;}
  .festival{font-size:12px;letter-spacing:4px;color:#d97706;font-weight:900}
  h1{margin:5px 0 2px;font-size:clamp(28px,4vw,42px);line-height:1; color:#1e3a8a}
  
  .business-brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 5px; }
  .logo-placeholder { width: 35px; height: 35px; background: linear-gradient(135deg, #f59e0b, #ea580c); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 18px; box-shadow: 0 4px 10px rgba(234,88,12,0.4); }
  .logo-placeholder::after { content: "A"; }
  .business-name { font-size: 24px; font-weight: 900; color: transparent; background-clip: text; -webkit-background-clip: text; background-image: linear-gradient(to right, #ea580c, #f59e0b); letter-spacing: 2px; text-transform: uppercase; }

  .layout { display: flex; gap: 20px; align-items: stretch; justify-content: center; flex-wrap: wrap; flex:1;}
  
  /* Bumper Prize Sidebar (Consistent with page.js) */
  .sidebar-prizes { 
    width: 280px; 
    background: linear-gradient(to bottom, #991b1b, #450a0a); 
    border: 4px solid #f59e0b; 
    border-radius: 16px; 
    padding: 12px; 
    box-shadow: 0 15px 30px rgba(0,0,0,0.3); 
    display: flex; 
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .sidebar-prizes::before {
    content: "";
    position: absolute; top:0; left:0; right:0; height: 60px;
    background: repeating-linear-gradient(90deg,transparent,transparent 20px,rgba(0,0,0,0.3) 20px,rgba(0,0,0,0.3) 40px);
    z-index: 0; mix-blend-mode: overlay;
  }
  .sidebar-title { font-size: 18px; font-weight: 900; color: #fde047; text-align: center; border-bottom: 2px solid rgba(245,158,11,0.5); padding-bottom: 8px; margin-bottom: 12px; text-transform: uppercase; position: relative; z-index: 1; letter-spacing: 1px;}
  .prizes-list { list-style: none; padding: 0; margin: 0; flex:1; overflow-y: auto; display:flex; flex-direction: column; gap:8px; position:relative; z-index:1;}
  .prize-row { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 8px; display: flex; align-items: center; gap: 12px; position: relative; }
  .prize-row.locked { opacity: 0.5; filter: grayscale(0.8); }
  .prize-row img { width: 45px; height: 45px; object-fit: contain; background: rgba(255,255,255,0.8); border-radius: 8px; padding: 2px;}
  .prize-row-info { display: flex; flex-direction: column; }
  .prize-row-info .p-name { font-size: 13px; font-weight: 900; color: #fef08a; line-height: 1.1; }
  .prize-row-info .p-badge { font-size: 10px; color: #fcd34d; margin-top: 2px; }
  .prize-row .lock-icon { position:absolute; top:-5px; right:-5px; background:#ef4444; color:white; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; box-shadow:0 2px 5px rgba(0,0,0,0.5); }
  .prize-row .claimed-by { font-size: 9px; color: #6ee7b7; font-weight: bold; margin-top:2px; }

  /* Main Game Area */
  .main-area { flex: 1; min-width: 320px; display: flex; flex-direction: column; }
  .table{
    position:relative;
    padding:20px;
    border:2px solid #38bdf8;
    border-radius:24px;
    background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.3));
    backdrop-filter: blur(10px);
    box-shadow:inset 0 0 0 7px rgba(255,255,255,0.5), 0 20px 50px #0003;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .status{text-align:center;min-height:30px;margin-bottom:15px;font-weight:900;color:#0f172a; font-size: 22px; background: rgba(255,255,255,0.6); padding: 10px 20px; border-radius: 99px; border: 2px dashed #0ea5e9;}

  .start{
    padding:16px 36px;border-radius:999px;
    background:linear-gradient(#0ea5e9,#2563eb);
    color:white;font-weight:900;box-shadow:0 8px 25px rgba(37,99,235,0.4);
    font-size: 20px; cursor: pointer; border:none;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
  }
  .start:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(37,99,235,0.5);}

  /* Animation Stage / Deck */
  .anim-stage { position: relative; height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .deck { position: relative; width: 90px; height: 140px; cursor:pointer;}
  .deck-card { position: absolute; inset: 0; border-radius: 8px; border: 2px solid #0284c7; background: radial-gradient(circle,#0ea5e9 0 16%,transparent 17%), repeating-linear-gradient(45deg,#0284c7 0 7px,#0369a1 7px 14px); box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
  
  /* Make it look like a thick deck */
  .deck-card:nth-child(1) { transform: translate(-4px, -4px); }
  .deck-card:nth-child(2) { transform: translate(-2px, -2px); }
  .deck-card:nth-child(3) { transform: translate(0, 0); }
  .deck-card:nth-child(4) { transform: translate(2px, 2px); }
  .deck-card:nth-child(5) { transform: translate(4px, 4px); box-shadow: 0 15px 25px rgba(0,0,0,0.5); }
  
  .deck.shuffle-anim .deck-card { animation: deckShuffle 0.6s ease-in-out infinite alternate; }
  @keyframes deckShuffle { 
    0% { transform: translateX(0) rotate(0deg); } 
    50% { transform: translateX(25px) rotate(8deg); } 
    100% { transform: translateX(-25px) rotate(-8deg); } 
  }

  /* Dealt Cards Grid */
  .hands-container { display: none; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: 800px; }
  .hand { width: 85px; height: 130px; position: relative; perspective: 1000px; cursor: pointer; transition: transform 0.2s; }
  .hand:hover { transform: translateY(-5px); }
  .hand.picked { pointer-events: none; }
  
  .hand .card-wrapper { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .hand .card-wrapper.flipped { transform: rotateY(180deg); }
  
  .hand .card-face, .hand .card-back { position: absolute; inset: 0; border-radius: 8px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 5px; }
  .hand .card-back { border: 2px solid #0284c7; background: radial-gradient(circle,#0ea5e9 0 16%,transparent 17%), repeating-linear-gradient(45deg,#0284c7 0 7px,#0369a1 7px 14px); color: white; font-size: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: box-shadow 0.3s; }
  .hand:hover .card-back { box-shadow: 0 0 15px rgba(14,165,233,0.8); border-color: #fcd34d; }
  
  .hand .card-face { transform: rotateY(180deg); border: 2px solid #d5a63b; background: linear-gradient(145deg, #fffaf0, #fef08a); text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2);}
  .hand .card-face img { width: 80%; height: 45px; object-fit: contain; margin-bottom: 4px; }
  .hand .card-face .title { font-size: 10px; font-weight: 900; color: #991b1b; line-height: 1.1; }
  .hand .card-face.bl { background: linear-gradient(145deg, #f7eee0, #ead8b8); }
  .hand .card-face.bl .title { color: #6a2b22; font-size: 12px; }

  .shake-more { animation: shakeMore 1.5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shakeMore { 
    0%,100%{transform:translateX(0) scale(1)} 
    10%,30%,50%,70%,90%{transform:translateX(-5px) rotate(-3deg) scale(1.05)} 
    20%,40%,60%,80%{transform:translateX(5px) rotate(3deg) scale(1.05)} 
  }

  .card-win-blast { animation: boomReveal 0.8s forwards; }
  @keyframes boomReveal {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.4); box-shadow: 0 0 50px rgba(255,217,109,1); z-index:50;}
    100% { transform: rotateY(180deg) scale(1.1); box-shadow: 0 0 30px rgba(255,217,109,0.8); z-index:10;}
  }

  /* Result Modal */
  .result{ display:none;position:fixed;inset:0;background:rgba(23,2,7,0.95); align-items:center;justify-content:center;z-index:100;padding:20px; backdrop-filter: blur(8px); }
  .result.show{display:flex}
  .modal{ width:min(550px,100%);text-align:center;padding:40px 30px; border-radius:32px;border:4px solid #eab308; background:linear-gradient(135deg, #eff6ff, #dbeafe); box-shadow:0 30px 100px #000b;animation:pop .5s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .modal.mega-blast { animation: megaPop .8s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 150px rgba(255,217,109,0.9); border-color: #f59e0b; }
  @keyframes megaPop { 0% { transform: scale(.5); opacity: 0; } 50% { transform: scale(1.1); box-shadow: 0 0 200px rgba(255,217,109,1); } 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 100px rgba(255,217,109,0.9); } }
  .modal h2{margin:10px 0;font-size:36px;color:#1e3a8a;font-weight:900;}
  .prize-img-container { width: 160px; height: 160px; margin: 20px auto; background: radial-gradient(circle, rgba(255,255,255,0.9), transparent); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .prize-img-container img { max-width: 120px; max-height: 120px; object-fit: contain; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.4)); animation: floatPrize 3s ease-in-out infinite; }
  @keyframes floatPrize { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  .amount{font-size:32px;font-weight:900;color:#059669; margin-bottom: 5px;}
  .modal p{color:#334155;font-weight:bold;font-size:18px; margin: 0;}
  .again{margin-top:25px;padding:16px 36px;border-radius:999px;background:linear-gradient(to right, #ea580c, #f59e0b);color:#fff;font-weight:900;font-size:18px;border:none;cursor:pointer; transition:transform 0.2s;}
  .again:hover { transform: scale(1.05); }
  
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
  .piece{position:absolute;top:-20px;width:10px;height:18px;animation:fall 2.5s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

  @media(max-width:768px){ .layout { flex-direction: column-reverse; } .sidebar-prizes { width: 100%; max-width: 500px; margin: 0 auto; height: 300px;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="business-brand">
      <div class="logo-placeholder"></div>
      <div class="business-name">ALAMTECH</div>
    </div>
    <div class="festival">DASHAIN & TIHAR 2086</div>
    <h1 style="font-weight: 900;">BUMPER FARAS FINALE</h1>
    <div class="sub">Three picks. One Deck. Incredible Prizes.</div>
  </header>

  <div class="layout">
    
    <div class="main-area">
      <div class="table" id="gameTable">
        <div class="status" id="status">Press Shuffle to mix the Bumper Cards!</div>
        
        <div class="anim-stage" id="animStage">
          <div class="deck" id="deck">
            <div class="deck-card"></div>
            <div class="deck-card"></div>
            <div class="deck-card"></div>
            <div class="deck-card"></div>
            <div class="deck-card"></div>
          </div>
        </div>

        <button class="start" id="startBtn">🔀 SHUFFLE DECK</button>

        <div class="hands-container" id="handsContainer">
          <!-- Cards generated here -->
        </div>
      </div>
    </div>

    <!-- Bumper Prizes Sidebar -->
    <div class="sidebar-prizes">
      <div class="sidebar-title">Bumper Prizes</div>
      <ul class="prizes-list" id="prizesList">
        <!-- populated dynamically -->
      </ul>
    </div>

  </div>
</div>

<div class="result" id="result">
  <div class="modal" id="resultModal">
    <h2 id="resultTitle">YOUR DASHAIN REWARD!</h2>
    <div class="prize-img-container" id="prizeImgContainer">
      <img src="" alt="Prize" id="resultImg" />
    </div>
    <div class="amount" id="resultAmount"></div>
    <p id="resultText"></p>
    <button class="again" id="closeBtn">FINISH</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
const ALL_PRIZES = [
  { id: "monitor", name: "Dahua Monitor", img: "/products/dahua_monitor.jpg", locked: false, badge: "🖥️ BUMPER" },
  { id: "camera", name: "Dahua WiFi Camera", img: "/products/Smartwatch.webp", locked: false, badge: "📷 BUMPER" },
  { id: "smartwatch", name: "Smart Watch", img: "/products/Smartwatch.webp", locked: false, badge: "⌚ BUMPER" },
  { id: "cooler", name: "Laptop Cooler", img: "/products/laptopstand.jpg", locked: false, badge: "❄️ BUMPER" },
  { id: "macbook", name: "MacBook Air M5", img: "/products/macbook_air.jpg", locked: true, badge: "💻 BUMPER" },
  { id: "khasi", name: "Dashain Khasi", img: "/products/Goat.jpg", locked: true, badge: "🐐 BUMPER" },
  { id: "tv", name: "Alista TV", img: "/products/dahua_monitor.jpg", locked: true, badge: "📺 BUMPER" }
];

const TOTAL_CARDS_ON_TABLE = 14; 
let picksRemaining = 3;
let gameState = "initial"; 
let wonPrizesData = []; 

// LocalStorage Utils
function getClaimedPrizes() {
  try {
    const raw = localStorage.getItem("faras_winners");
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveClaimedPrize(prizeId, prizeName, winnerName) {
  const current = getClaimedPrizes();
  current.push({ prizeId, prizeName, winnerName, date: Date.now() });
  localStorage.setItem("faras_winners", JSON.stringify(current));
  renderSidebar();
}
function getCurrentWinnerName() {
  try {
    const raw = localStorage.getItem("alamtech_dashain_session_v2");
    if (raw) {
      const sess = JSON.parse(raw);
      if (sess.name) return sess.name;
    }
  } catch (e) {}
  return "Lucky Winner";
}

// Render Sidebar
function renderSidebar() {
  const claimed = getClaimedPrizes();
  const list = document.getElementById("prizesList");
  
  list.innerHTML = ALL_PRIZES.map(p => {
    const claimData = claimed.find(c => c.prizeId === p.id);
    const isLocked = p.locked || claimData;
    const lockHtml = isLocked ? `<div class="lock-icon">🔒</div>` : '';
    const claimHtml = claimData ? `<div class="claimed-by">Won by: ${claimData.winnerName}</div>` : '';
    
    return `
      <li class="prize-row ${isLocked ? 'locked' : ''}">
        ${lockHtml}
        <img src="${p.img}" alt="${p.name}" />
        <div class="prize-row-info">
          <div class="p-name">${p.name}</div>
          <div class="p-badge">${p.badge}</div>
          ${claimHtml}
        </div>
      </li>
    `;
  }).join("");
}

// Audio Engine
let audioCtx = null;
function getAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, duration=.12, type="sine", volume=.035, delay=0){
  const ctx=getAudio(), o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,ctx.currentTime+delay);
  g.gain.setValueAtTime(0,ctx.currentTime+delay);
  g.gain.linearRampToValueAtTime(volume,ctx.currentTime+delay+.012);
  g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+duration);
  o.connect(g);g.connect(ctx.destination);
  o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+duration+.03);
}
function playShuffle(){
  tone(115,.07,"sawtooth",.025); tone(145,.06,"sawtooth",.018,.08);
}
function playFlip(){ tone(420,.07,"triangle",.03); tone(650,.11,"triangle",.025,.06); }
function playBigWin(){
  [392,523,659,784,1047].forEach((f,i)=>tone(f,.26,"triangle",.06,i*.105));
  setTimeout(()=>tone(1319,.4,"sine",.055),580);
}
function playLose(){ tone(330,.18,"sine",.025); tone(247,.28,"sine",.02,.13); }
function snareHit(ctx, delay) {
  const osc = ctx.createOscillator(); const oscGain = ctx.createGain();
  osc.type = "triangle"; osc.connect(oscGain); oscGain.connect(ctx.destination);
  osc.frequency.setValueAtTime(250, ctx.currentTime + delay);
  oscGain.gain.setValueAtTime(0.04, ctx.currentTime + delay);
  oscGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.05);
  osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.1);
}
function playDrumRoll() { const ctx = getAudio(); for (let i = 0; i < 20; i++) snareHit(ctx, i * 0.07); }

async function startShuffle() {
  if (gameState !== "initial") return;
  getAudio();
  gameState = "shuffling";
  
  document.getElementById("startBtn").style.display = "none";
  document.getElementById("status").innerHTML = "Shuffling the Bumper Deck... <span style='color:#ea580c'>Wait for it!</span>";
  
  const deck = document.getElementById("deck");
  deck.classList.add("shuffle-anim");
  
  for(let i=0; i<8; i++){
    playShuffle();
    await new Promise(r => setTimeout(r, 150));
  }
  
  deck.classList.remove("shuffle-anim");
  document.getElementById("animStage").style.display = "none";
  
  document.getElementById("status").innerHTML = `Cards Dealt! You have <strong style="color:#ea580c; font-size:28px;">3</strong> picks left.`;
  
  // Render Cards Grid
  const handsContainer = document.getElementById("handsContainer");
  handsContainer.innerHTML = Array.from({length: TOTAL_CARDS_ON_TABLE}).map((_, i) => `
    <div class="hand" data-cid="${i}">
      <div class="card-wrapper" id="card-${i}">
        <div class="card-back"><span>✦<br>★<br>✦</span></div>
        <div class="card-face" id="face-${i}"></div>
      </div>
    </div>
  `).join("");
  
  handsContainer.style.display = "flex";
  gameState = "picking";
  
  document.querySelectorAll(".hand").forEach(el => {
    el.addEventListener("click", () => handlePick(el));
  });
}

async function handlePick(el) {
  if (gameState !== "picking" || el.classList.contains("picked") || picksRemaining <= 0) return;
  
  gameState = "animating";
  el.classList.add("picked");
  picksRemaining--;
  
  document.getElementById("status").textContent = "Revealing...";
  
  // Determine Outcome for this pick
  const claimed = getClaimedPrizes().map(c => c.prizeId);
  const winnable = ALL_PRIZES.filter(p => !p.locked && !claimed.includes(p.id));
  
  let outcome = null;
  const rand = Math.random();
  if (rand <= 0.02 && winnable.length > 0) { // 2% chance per pick
    outcome = winnable[Math.floor(Math.random() * winnable.length)];
  }
  
  const cid = el.dataset.cid;
  const face = document.getElementById(`face-${cid}`);
  
  if (outcome) {
    face.innerHTML = `<img src="${outcome.img}" alt="${outcome.name}" /><div class="title">${outcome.name}</div>`;
  } else {
    face.classList.add("bl");
    face.innerHTML = `<div class="title">🙂<br>BETTER<br>LUCK</div>`;
  }
  
  const cardWrapper = document.getElementById(`card-${cid}`);
  playDrumRoll();
  cardWrapper.classList.add("shake-more");
  
  await new Promise(r => setTimeout(r, 1600));
  
  cardWrapper.classList.remove("shake-more");
  cardWrapper.classList.add("flipped");
  playFlip();
  
  if (outcome) {
    playBigWin();
    cardWrapper.classList.add("card-win-blast");
    const wName = getCurrentWinnerName();
    saveClaimedPrize(outcome.id, outcome.name, wName);
    wonPrizesData.push(outcome);
    
    // Massive Celebration
    for (let i=0;i<60;i++) setTimeout(()=>makeConfetti(true), i*20);
    
    document.getElementById("status").innerHTML = `🎉 <strong>YOU WON ${outcome.name}!</strong> 🎉`;
    await new Promise(r => setTimeout(r, 2000));
  } else {
    playLose();
  }
  
  if (picksRemaining > 0) {
    document.getElementById("status").innerHTML = `Pick again! You have <strong style="color:#ea580c; font-size:28px;">${picksRemaining}</strong> picks left.`;
    gameState = "picking";
  } else {
    document.getElementById("status").textContent = "All picks used! Game Over.";
    await new Promise(r => setTimeout(r, 1500));
    showResultModal();
  }
}

function showResultModal() {
  const resultModal = document.getElementById("resultModal");
  if (wonPrizesData.length > 0) {
    const topPrize = wonPrizesData[0];
    resultModal.classList.add("mega-blast");
    document.getElementById("resultTitle").textContent = "🎉 GRAND FINALE WINNER! 🎉";
    document.getElementById("resultAmount").textContent = topPrize.name;
    document.getElementById("resultText").textContent = `Congratulations! You claimed a premium bumper offer!`;
    document.getElementById("resultImg").src = topPrize.img;
    document.getElementById("prizeImgContainer").style.display = "flex";
    for (let i=0;i<80;i++) setTimeout(()=>makeConfetti(true), i*15);
  } else {
    document.getElementById("resultTitle").textContent = "🙂 BETTER LUCK NEXT TIME";
    document.getElementById("resultAmount").textContent = "";
    document.getElementById("resultText").textContent = "You used all 3 picks, but no bumper prize this time.";
    document.getElementById("prizeImgContainer").style.display = "none";
  }
  document.getElementById("result").classList.add("show");
}

function makeConfetti(big) {
  const el = document.createElement("div");
  el.className = "piece"; el.style.left = Math.random()*100 + "%";
  el.style.animationDuration = (1.5 + Math.random()*1.2) + "s";
  el.style.transform = `rotate(${Math.random()*360}deg)`;
  const colors = ["#ea580c", "#f59e0b", "#3b82f6", "#10b981", "#ef4444"];
  el.style.background = colors[Math.floor(Math.random()*colors.length)];
  el.style.width = (big ? 10 : 6) + Math.random()*6 + "px"; el.style.height = (big ? 16 : 8) + Math.random()*8 + "px";
  document.getElementById("confetti").appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

document.getElementById("startBtn").addEventListener("click", startShuffle);
document.getElementById("closeBtn").addEventListener("click", () => {
  const val = wonPrizesData.length > 0 ? 50000 : 0; 
  const nm = wonPrizesData.length > 0 ? wonPrizesData[0].name : "Better Luck Next Time";
  window.parent.postMessage({ type: 'FARAS_DONE', prize: { value: val, name: nm } }, '*');
});

renderSidebar();
</script>
</body>
</html>
